[bar.default]
radius = 0
margin_ends = 0

start  = ["launcher", "workspaces", "spacer", "quick-action"]
center = ["clock"]
end    = ["media", "notifications", "network", "bluetooth", "volume", "brightness", "battery", "tray", "control-center"]

[widget.clock]
format = "{:%d %b  %H:%M}"
tooltip_format = "{:%A %B %d %Y%n%H:%M:%S %Z}"

[widget.network]
show_label = false

[widget.quick-action]
type = "custom_button"
glyph = "keyboard"

[widget.quick-action.actions]
left = "exec kill -n 34 $(pgrep wvkbd-deskintl)"
