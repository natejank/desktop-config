[include]
autoload = false
files = [
  "modules/",
  "enabled/",
]

[theme]
builtin = "Gruvbox"
mode = "light"

[shell]
telemetry_enabled = true
clipboard_enabled = false

[shell.screenshot]
directory = "~/Pictures/Screenshots"

[storage]
key_source = "secret-service"
corner_radius_scale = 0

[location]
auto_locate = true

[nightlight]
enabled = true
temperature_day = 6500
temperature_night = 3000

[system.monitor]
enabled = false

[weather]
enabled = false

[idle.behavior.lock]
timeout = 600
action = "lock"

[idle.behavior.suspend]
timeout = 720
lock_before_suspend = true
action = "suspend"
